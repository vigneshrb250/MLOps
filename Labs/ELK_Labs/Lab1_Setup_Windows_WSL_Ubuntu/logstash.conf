input {
  file {
    # This path is where training.log is mounted inside the Logstash container
    path => "/usr/share/logstash/logs/training.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "plain"
  }
}

filter {
  # Step 1: Parse the base log format
  # Extracts: timestamp, log level, and the rest of the message
  # Example line: 2026-04-10 22:16:51,077 - INFO - F1 Score: 0.9852
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:log_timestamp} - %{LOGLEVEL:log_level} - %{GREEDYDATA:log_message}"
    }
  }

  # Step 2: Extract individual metrics from log_message
  # Each grok block looks for a specific metric pattern and pulls out the numeric value

  # Number of trees used in this run
  grok {
    match => { "log_message" => "n_estimators: %{NUMBER:n_estimators}" }
    tag_on_failure => []
  }

  # How long the model took to train (seconds)
  grok {
    match => { "log_message" => "Training Time: %{NUMBER:training_time}" }
    tag_on_failure => []
  }

  # Classification metrics
  grok {
    match => { "log_message" => "Accuracy: %{NUMBER:accuracy}" }
    tag_on_failure => []
  }

  grok {
    match => { "log_message" => "F1 Score: %{NUMBER:f1_score}" }
    tag_on_failure => []
  }

  grok {
    match => { "log_message" => "Precision: %{NUMBER:precision}" }
    tag_on_failure => []
  }

  grok {
    match => { "log_message" => "Recall: %{NUMBER:recall}" }
    tag_on_failure => []
  }

  # Confusion matrix counts
  grok {
    match => { "log_message" => "True Positive: %{NUMBER:true_positive}" }
    tag_on_failure => []
  }

  grok {
    match => { "log_message" => "True Negative: %{NUMBER:true_negative}" }
    tag_on_failure => []
  }

  grok {
    match => { "log_message" => "False Positive: %{NUMBER:false_positive}" }
    tag_on_failure => []
  }

  grok {
    match => { "log_message" => "False Negative: %{NUMBER:false_negative}" }
    tag_on_failure => []
  }

  grok {
    match => { "log_message" => "False Positive Rate: %{NUMBER:fpr}" }
    tag_on_failure => []
  }

  grok {
    match => { "log_message" => "False Negative Rate: %{NUMBER:fnr}" }
    tag_on_failure => []
  }

  # Summary line parser — extracts all metrics from one line per run
  # This creates a single complete document per run for Kibana visualizations
  grok {
    match => { "log_message" => "RUN_SUMMARY n_estimators=%{NUMBER:run_n_estimators} training_time=%{NUMBER:run_training_time} accuracy=%{NUMBER:run_accuracy} f1_score=%{NUMBER:run_f1} precision=%{NUMBER:run_precision} recall=%{NUMBER:run_recall} fpr=%{NUMBER:run_fpr} fnr=%{NUMBER:run_fnr} tp=%{NUMBER:run_tp} tn=%{NUMBER:run_tn} fp=%{NUMBER:run_fp} fn=%{NUMBER:run_fn}" }
    tag_on_failure => []
  }

  # Step 3: Convert extracted strings to actual numbers
  # By default grok extracts everything as strings.
  # This tells Elasticsearch to store them as float/integer so we can plot them.
  mutate {
    convert => {
      "n_estimators"  => "integer"
      "training_time" => "float"
      "accuracy"      => "float"
      "f1_score"      => "float"
      "precision"     => "float"
      "recall"        => "float"
      "fpr"           => "float"
      "fnr"           => "float"
      "true_positive" => "integer"
      "true_negative" => "integer"
      "false_positive" => "integer"
      "false_negative" => "integer"
      "run_n_estimators"  => "integer"
      "run_training_time" => "float"
      "run_accuracy"      => "float"
      "run_f1"            => "float"
      "run_precision"     => "float"
      "run_recall"        => "float"
      "run_fpr"           => "float"
      "run_fnr"           => "float"
      "run_tp"            => "integer"
      "run_tn"            => "integer"
      "run_fp"            => "integer"
      "run_fn"            => "integer"
    }
  }
}

output {
  # Send parsed documents to Elasticsearch
  # Each log line becomes one document in the "heart-disease-training" index
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "heart-disease-training"
  }

  # Also print to terminal so you can see what's being sent (useful for debugging)
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
